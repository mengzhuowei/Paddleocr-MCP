[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paddleocr-mcp"
version = "0.1.0"
description = "MCP server that exposes local PaddleOCR text recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paddleocr>=3.0",
    "mcp>=2.0,<3",
]

[project.scripts]
paddleocr-mcp = "paddleocr_mcp:main"

[tool.setuptools]
py-modules = ["paddleocr_mcp"]
